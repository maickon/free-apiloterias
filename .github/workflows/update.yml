name: Update lottery data

on:
  schedule:
    # 06:30, 12:30, 18:30, 23:30 UTC  →  03:30, 09:30, 15:30, 20:30 BRT
    # The 23:30 UTC run catches results from draws that happen ~20:00 BRT
    - cron: '30 6,12,18,23 * * *'
  workflow_dispatch:   # allows manual trigger from the GitHub UI

permissions:
  contents: write      # needed for git push via GITHUB_TOKEN

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch latest lottery results
        env:
          LOTTERY_API_BASE: ${{ secrets.LOTTERY_API_BASE }}
        run: python scripts/update.py

      - name: Commit and push if there are new results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add database/
          if git diff --staged --quiet; then
            echo "No new results — nothing to commit."
          else
            git commit -m "chore: update lottery results [skip ci]"
            git push
          fi
